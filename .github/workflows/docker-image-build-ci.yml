name: Test docker image build

on:
  workflow_call:
    inputs:
      dockerfile:
        description: 'Dockerfile path relative to the build context'
        type: string
        required: false
        default: 'Dockerfile'
      platforms:
        type: string
        required: false
        default: 'linux/amd64'

jobs:
  build-docker-image:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          # setup-qemu-action uses `tonistiigi/binfmt:latest` by default, which causes errors when building for ARM.
          # Pinning to a fixed version to work around it.
          # See https://github.com/docker/setup-qemu-action/issues/188#issuecomment-2604322104
          image: tonistiigi/binfmt:qemu-v8.1.5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Test docker image build
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: docker buildx build --file "$DOCKERFILE" --platform ${{ inputs.platforms }} --tag shlink-docker-image:temp .
